<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .chat-container {
            width: 90%; /* Adjusted to 90% to make it almost full screen */
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: both;
            overflow: auto;
        }
        .chat-box {
            width: 100%;
            height: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }
        .chat-input {
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .chat-button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }
        .example-requests {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
<div class="header">
    <h1 style="text-align: center;">Chat Bot</h1>
    <p>Questa pagina è stata creata per fornire informazioni inerenti ai files pdf caricati</p>
</div>
<div class="chat-container">
    <div class="chat-box" id="chatBox"></div>
    <input type="text" id="chatInput" class="chat-input" placeholder="Type your message here...">
    <button class="chat-button" onclick="sendMessage()">Send</button>
</div>
<div class="file-upload-container">
    <h3>Upload PDF</h3>
    <input type="file" id="pdfFile" accept="application/pdf">
    <button class="chat-button" onclick="uploadPdf()">Upload</button>
</div>
<div class="footer">
    <p>Per ottenere informazioni, inserisci la tua domanda nel campo di testo e premi
        il pulsante "Send".</p>
    <p>N.B. Hardware limitato;I tempi di risposta potrebbero essere molto lunghi <b>(fino a 5 minuti)</b></p>
</div>


    <script>
        async function sendMessage() {
            const message = document.getElementById('chatInput').value;
            if (!message) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div><strong>You:</strong> ${message}</div>`;
             document.getElementById('chatInput').value = '';
            try {
                const response = await fetch('http://localhost:8080/info?question=' + encodeURIComponent(message), {
                    method: 'GET',
                    headers: {
                        'Accept': '*/*'
                    }
                });
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.text();
                chatBox.innerHTML += `<div><strong>Bot:</strong> ${data}</div>`;
            } catch (error) {
                chatBox.innerHTML += `<div><strong>Error:</strong> ${error.message}</div>`;
            }

             document.getElementById('chatInput').value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function uploadPdf() {
            const fileInput = document.getElementById('pdfFile');
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('http://localhost:8080/uploadPdf', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.text();
                alert('File uploaded and processed successfully!');
            } catch (error) {
                alert('Failed to upload and process file: ' + error.message);
            }
        }
    </script>
</div>
</body>
</html>
